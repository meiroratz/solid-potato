<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Your Counselor!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Starfield */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 40%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 10%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 60%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 25%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 75%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 80%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 55%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 90%, #fff 0%, transparent 100%),
        radial-gradient(2px 2px at 5%  50%, #ffe 0%, transparent 100%),
        radial-gradient(2px 2px at 95% 45%, #ffe 0%, transparent 100%),
        radial-gradient(2px 2px at 40% 20%, #ffe 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    h1 {
      font-size: 2.4rem;
      text-align: center;
      margin: 20px 0 6px;
      text-shadow: 0 0 20px #a78bfa;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      color: #c4b5fd;
      font-size: 1rem;
      margin-bottom: 24px;
      z-index: 1;
    }

    /* ── Scoreboard ── */
    #scoreboard {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      z-index: 1;
    }

    .score-box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px 22px;
      text-align: center;
    }

    .score-box span { display: block; }
    .score-label { font-size: 0.75rem; color: #a78bfa; text-transform: uppercase; letter-spacing: 1px; }
    .score-value { font-size: 1.8rem; font-weight: 700; }

    /* ── Card ── */
    #game-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 30px 28px;
      width: 100%;
      max-width: 600px;
      z-index: 1;
      backdrop-filter: blur(8px);
    }

    .round-label {
      font-size: 0.8rem;
      color: #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .clue-box {
      background: rgba(0,0,0,0.35);
      border-left: 4px solid #a78bfa;
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 6px;
    }

    .clue-number {
      font-size: 0.72rem;
      color: #a78bfa;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .clue-text {
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .clues-revealed {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 20px;
      text-align: right;
    }

    /* ── Choices ── */
    #choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .choice-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      padding: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, border-color 0.2s;
    }

    .choice-btn:hover:not(:disabled) {
      background: rgba(167,139,250,0.25);
      border-color: #a78bfa;
      transform: translateY(-2px);
    }

    .choice-btn.correct {
      background: rgba(34,197,94,0.3);
      border-color: #22c55e;
    }

    .choice-btn.wrong {
      background: rgba(239,68,68,0.3);
      border-color: #ef4444;
    }

    .choice-btn:disabled { cursor: default; }

    /* ── Hint button ── */
    #hint-btn {
      display: block;
      margin: 16px auto 0;
      background: transparent;
      border: 1px dashed #7dd3fc;
      border-radius: 8px;
      color: #7dd3fc;
      padding: 8px 22px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #hint-btn:hover:not(:disabled) { background: rgba(125,211,252,0.12); }
    #hint-btn:disabled { opacity: 0.35; cursor: default; }

    /* ── Feedback ── */
    #feedback {
      margin-top: 18px;
      min-height: 48px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
    }

    #feedback.correct { color: #4ade80; }
    #feedback.wrong   { color: #f87171; }

    /* ── Next button ── */
    #next-btn {
      display: none;
      margin: 16px auto 0;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      padding: 12px 32px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    #next-btn:hover { opacity: 0.88; transform: translateY(-1px); }

    /* ── End screen ── */
    #end-screen {
      display: none;
      text-align: center;
      z-index: 1;
      width: 100%;
      max-width: 500px;
    }

    .trophy { font-size: 5rem; margin-bottom: 16px; }

    #end-screen h2 { font-size: 2rem; margin-bottom: 10px; }
    #end-screen p  { color: #c4b5fd; margin-bottom: 24px; font-size: 1.1rem; }

    #restart-btn {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      padding: 14px 40px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #restart-btn:hover { opacity: 0.85; }

    /* ── Intro ── */
    #intro {
      text-align: center;
      z-index: 1;
      max-width: 520px;
    }

    #intro p {
      color: #c4b5fd;
      line-height: 1.7;
      margin-bottom: 28px;
      font-size: 1.05rem;
    }

    #start-btn {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1.15rem;
      padding: 16px 44px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 0 30px rgba(124,58,237,0.4);
    }

    #start-btn:hover { opacity: 0.88; transform: scale(1.03); }

    .moon { font-size: 4rem; margin-bottom: 16px; display: block; }

    @media (max-width: 420px) {
      h1 { font-size: 1.7rem; }
      #choices { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<h1>🌙 Guess Your Counselor!</h1>
<p class="subtitle">A Night Activity Game</p>

<!-- Intro -->
<div id="intro">
  <span class="moon">🏕️</span>
  <p>
    Read the clues carefully — each one describes one of your counselors.<br />
    Reveal more hints if you're stuck, but fewer hints = more points!<br />
    Can you guess them all?
  </p>
  <button id="start-btn" onclick="startGame()">Start Game ✨</button>
</div>

<!-- Scoreboard -->
<div id="scoreboard" style="display:none;">
  <div class="score-box">
    <span class="score-label">Score</span>
    <span class="score-value" id="score-display">0</span>
  </div>
  <div class="score-box">
    <span class="score-label">Round</span>
    <span class="score-value" id="round-display">1</span>
  </div>
  <div class="score-box">
    <span class="score-label">Streak 🔥</span>
    <span class="score-value" id="streak-display">0</span>
  </div>
</div>

<!-- Game card -->
<div id="game-card" style="display:none;">
  <div class="round-label" id="round-label">Round 1</div>
  <div id="clues-container"></div>
  <div class="clues-revealed" id="clues-meta"></div>
  <button id="hint-btn" onclick="revealNextClue()">💡 Reveal another clue (−1 pt)</button>
  <div id="choices"></div>
  <div id="feedback"></div>
  <button id="next-btn" onclick="nextRound()">Next Round →</button>
</div>

<!-- End screen -->
<div id="end-screen">
  <div class="trophy" id="trophy-emoji">🏆</div>
  <h2 id="end-title">Game Over!</h2>
  <p id="end-msg"></p>
  <button id="restart-btn" onclick="startGame()">Play Again 🔄</button>
</div>

<script>
// ─────────────────────────────────────────────
//  COUNSELOR DATA  – edit this to fit your camp!
// ─────────────────────────────────────────────
const counselors = [
  {
    name: "Jordan",
    clues: [
      "This counselor always has a water bottle in hand and insists on staying hydrated.",
      "They can name every Marvel movie in release-date order.",
      "Their go-to dance move is \"the sprinkler\" — unironically.",
      "They once ate six s'mores in a single campfire session… and wasn't even sorry.",
    ],
  },
  {
    name: "Taylor",
    clues: [
      "This counselor starts every morning with a 10-minute stretch routine.",
      "They have a different pair of funky socks for every day of camp.",
      "Ask them anything about dinosaurs — they will answer for way too long.",
      "Their cabin nickname is 'The Human Alarm Clock' because they're always early.",
    ],
  },
  {
    name: "Morgan",
    clues: [
      "This counselor can juggle three things… badly.",
      "They have memorized the lyrics to every song from a certain animated movie (you know which one).",
      "They always know who took the last snack — somehow.",
      "Their secret talent: making animal sounds that are actually convincing.",
    ],
  },
  {
    name: "Casey",
    clues: [
      "This counselor has never lost a game of rock-paper-scissors. Ever.",
      "They bring a different book to every activity and reads two pages wherever they go.",
      "They insist their homemade trail mix is \"legendary.\"",
      "Their cabin is always the tidiest — and they'll tell you about it.",
    ],
  },
  {
    name: "Riley",
    clues: [
      "This counselor greets everyone with a personalized handshake.",
      "They've been to camp more years than anyone can remember.",
      "Their campfire stories always end with everyone too scared to sleep.",
      "They secretly practice magic tricks in the mirror every night.",
    ],
  },
  {
    name: "Sam",
    clues: [
      "This counselor can identify any bird by its call.",
      "They once fixed a canoe with only a bandana and determination.",
      "They have a playlist for every possible mood and will DJ any situation.",
      "Their laugh is so contagious that the whole cabin starts laughing even if no one knows why.",
    ],
  },
];

// ─────────────────────────────────────────────
const POINTS_PER_CLUE = [5, 4, 3, 2]; // points for answering on clue 1/2/3/4
const CLUES_PER_ROUND_START = 1;

let questions = [];
let currentIdx = 0;
let score = 0;
let streak = 0;
let cluesShown = 0;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestions() {
  const shuffled = shuffle(counselors);
  return shuffled.map(c => {
    const wrong = shuffle(counselors.filter(x => x.name !== c.name)).slice(0, 3);
    const choices = shuffle([c, ...wrong]).map(x => x.name);
    return { counselor: c, choices };
  });
}

function startGame() {
  questions = buildQuestions();
  currentIdx = 0;
  score = 0;
  streak = 0;

  document.getElementById('intro').style.display = 'none';
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('scoreboard').style.display = 'flex';
  document.getElementById('game-card').style.display = 'block';

  updateScoreboard();
  loadRound();
}

function loadRound() {
  answered = false;
  cluesShown = CLUES_PER_ROUND_START;

  const q = questions[currentIdx];
  document.getElementById('round-label').textContent = `Round ${currentIdx + 1} of ${questions.length}`;
  document.getElementById('round-display').textContent = `${currentIdx + 1}/${questions.length}`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
  document.getElementById('next-btn').style.display = 'none';

  renderClues(q);
  renderChoices(q);
  updateHintBtn(q);
}

function renderClues(q) {
  const container = document.getElementById('clues-container');
  container.innerHTML = '';
  for (let i = 0; i < cluesShown; i++) {
    const box = document.createElement('div');
    box.className = 'clue-box';
    box.innerHTML = `<div class="clue-number">Clue ${i + 1}</div>
                     <div class="clue-text">${q.counselor.clues[i]}</div>`;
    container.appendChild(box);
  }
  document.getElementById('clues-meta').textContent =
    `Showing ${cluesShown} of ${q.counselor.clues.length} clues`;
}

function renderChoices(q) {
  const container = document.getElementById('choices');
  container.innerHTML = '';
  q.choices.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = name;
    btn.onclick = () => makeGuess(name, btn, q);
    container.appendChild(btn);
  });
}

function updateHintBtn(q) {
  const btn = document.getElementById('hint-btn');
  btn.disabled = answered || cluesShown >= q.counselor.clues.length;
}

function revealNextClue() {
  const q = questions[currentIdx];
  if (cluesShown >= q.counselor.clues.length) return;
  cluesShown++;
  renderClues(q);
  updateHintBtn(q);
}

function makeGuess(name, btn, q) {
  if (answered) return;
  answered = true;

  const correct = name === q.counselor.name;
  const pts = correct ? (POINTS_PER_CLUE[cluesShown - 1] ?? 1) : 0;

  // Highlight buttons
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.counselor.name) b.classList.add('correct');
  });
  if (!correct) btn.classList.add('wrong');

  if (correct) {
    score += pts;
    streak++;
    const streakMsg = streak >= 3 ? ` 🔥 ${streak} in a row!` : '';
    document.getElementById('feedback').textContent = `✅ Correct! +${pts} point${pts !== 1 ? 's' : ''}${streakMsg}`;
    document.getElementById('feedback').className = 'correct';
  } else {
    streak = 0;
    document.getElementById('feedback').textContent = `❌ Nope! It was ${q.counselor.name}.`;
    document.getElementById('feedback').className = 'wrong';
  }

  updateScoreboard();
  document.getElementById('hint-btn').disabled = true;
  document.getElementById('next-btn').style.display = 'block';
  document.getElementById('next-btn').textContent =
    currentIdx + 1 < questions.length ? 'Next Round →' : 'See Results 🎉';
}

function nextRound() {
  currentIdx++;
  if (currentIdx >= questions.length) {
    showEndScreen();
  } else {
    loadRound();
  }
}

function updateScoreboard() {
  document.getElementById('score-display').textContent = score;
  document.getElementById('streak-display').textContent = streak;
}

function showEndScreen() {
  document.getElementById('game-card').style.display = 'none';
  document.getElementById('scoreboard').style.display = 'none';
  document.getElementById('end-screen').style.display = 'block';

  const max = questions.length * POINTS_PER_CLUE[0];
  const pct = score / max;

  let emoji, title, msg;
  if (pct === 1) {
    emoji = '🏆'; title = 'PERFECT SCORE!';
    msg = `${score}/${max} — You know your counselors better than they know themselves!`;
  } else if (pct >= 0.7) {
    emoji = '🌟'; title = 'Great Job!';
    msg = `${score}/${max} — You've been paying attention at camp!`;
  } else if (pct >= 0.4) {
    emoji = '🏕️'; title = 'Not Bad!';
    msg = `${score}/${max} — Spend a little more time with your counselors!`;
  } else {
    emoji = '🔦'; title = 'Keep Trying!';
    msg = `${score}/${max} — Maybe introduce yourself to your counselors tomorrow!`;
  }

  document.getElementById('trophy-emoji').textContent = emoji;
  document.getElementById('end-title').textContent = title;
  document.getElementById('end-msg').textContent = msg;
}
</script>
</body>
</html>
